<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Critical fonts: Yomogi (handwriting) + Noto Serif JP (body) loaded with swap -->

      as="style"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Mali:wght@400;600&family=Caveat:wght@400;600&family=Patrick+Hand+SC&family=Zen+Kurenaido&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />

      <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Mali:wght@400;600&family=Caveat:wght@400;600&family=Patrick+Hand+SC&family=Zen+Kurenaido&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!-- Preload Yomogi (primary diary font) -->
    <link
      rel="preload"
      href="https://fonts.gstatic.com/s/yomogi/v11/VuJwdNrS2ZL7qpnvZH4.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
